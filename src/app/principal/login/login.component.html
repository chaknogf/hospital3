<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mlogin" novalidate>
  <div class="mlogin__group">
    <label class="mlogin__label" for="login-user">Usuario</label>
    <input
      id="login-user"
      type="text"
      class="mlogin__input"
      formControlName="username"
      placeholder="Ingrese su usuario"
      autocomplete="username"
      autofocus
      aria-label="Usuario"
    />
  </div>

  <div class="mlogin__group">
    <label class="mlogin__label" for="login-pass">Contraseña</label>
    <div class="mlogin__pw">
      <input
        id="login-pass"
        [type]="verPassword ? 'text' : 'password'"
        class="mlogin__input"
        formControlName="password"
        placeholder="Ingrese su contraseña"
        autocomplete="current-password"
        aria-label="Contraseña"
      />
      <button
        type="button"
        class="mlogin__pw-toggle"
        [attr.aria-label]="verPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        (click)="alternar()"
      >
        {{ verPassword ? 'Ocultar' : 'Mostrar' }}
      </button>
    </div>
  </div>

  @if (errorMessage) {
    <div class="mlogin__error" role="alert">
      {{ errorMessage }}
    </div>
  }

  <button type="submit" class="mlogin__btn" [disabled]="loading">
    @if (!loading) {
      Iniciar sesión
    } @else {
      <span class="mlogin__spinner" aria-hidden="true"></span>
      Ingresando...
    }
  </button>

  <button
    type="button"
    class="mlogin__forgot"
    (click)="reset()"
    aria-label="Recuperar contraseña"
  >
    ¿Olvidaste tu contraseña?
  </button>
</form>
