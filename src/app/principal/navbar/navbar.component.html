<nav class="navbar navbar-expand-lg sticky-top aurora-navbar no-print">
  <div class="container-fluid d-flex justify-content-between align-items-center">

    <!-- LOGO / MARCA -->
    <a class="navbar-brand d-flex align-items-center" role="button" (click)="menu()">
      <i class="bi bi-hospital fs-4 me-1"></i>
      <span [innerHTML]="logoicon"></span>
      <span class=" d-md-inline app-name">MedicalApp</span>

    </a>

    <!-- TÍTULO CENTRAL (solo desktop) -->
    <div class="title d-none d-md-flex flex-column text-center flex-grow-1">
      <span class="institucion-title">Ministerio de Salud y Asistencia Social</span>
      <span class="institucion-subtitle">Hospital General Tipo I de Tecpán Guatemala</span>
    </div>

    <!-- MENU / USUARIO (desktop) -->
    <div class="d-none d-md-flex flex-column align-items-end">
      <div class="d-flex align-items-center gap-3">
        <span class="navbar-text">
          <span class="text-bold">{{ usuario }}</span>
          <span class="text-muted rounded px-2">[ {{ rol }} ]</span>
        </span>
        <button class="btn btn-sm btn-outline" (click)="toggleTheme()" title="Cambiar tema"
          aria-label="Cambiar tema">
          <i class="bi bi-circle-half"></i>
          <span class="theme-label">{{ themeLabel() }}</span>
        </button>
        <button class="btn btn-sm btn-outline" (click)="logout()">
          <i class="bi bi-box-arrow-right"></i> Salir
        </button>
      </div>
      <ng-content select=".sync-indicator"></ng-content>
    </div>

    <!-- MENU COMPACTO (solo móvil) -->
    <div class="mobile-menu d-flex d-md-none">
      <button class="mobile-menu-toggle" type="button" (click)="toggleMenuMovil()"
        [attr.aria-expanded]="menuMovilAbierto()" aria-haspopup="menu" aria-label="Menú de usuario">
        <svg class="mobile-menu-icon" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
          <path d="M0 0h24v24H0z" fill="none" />
          <path fill="currentColor" d="M4.5 20q-.213 0-.357-.143T4 19.5t.143-.357T4.5 19h9.366q.213 0 .356.143q.144.143.144.357t-.144.357t-.356.143zm0-3.384q-.213 0-.357-.144Q4 16.329 4 16.115q0-.213.143-.356t.357-.143h15q.214 0 .357.143t.143.357t-.143.356t-.357.144zm1.116-3.385q-.691 0-1.153-.463T4 11.616v-6q0-.691.463-1.153T5.616 4h12.769q.69 0 1.153.463T20 5.616v6q0 .69-.462 1.152t-1.153.463z" />
        </svg>
      </button>

      @if (menuMovilAbierto()) {
        <div class="mobile-dropdown" role="menu">
          <div class="mobile-dropdown-user">
            <i class="bi bi-person-circle"></i>
            <div class="mobile-dropdown-user-info">
              <span class="text-bold">{{ usuario }}</span>
              <span class="text-muted">[ {{ rol }} ]</span>
            </div>
          </div>

          <button class="mobile-dropdown-item" type="button" role="menuitem" (click)="toggleTheme()">
            <i class="bi bi-circle-half"></i>
            <span>Tema: {{ themeLabel() }}</span>
          </button>

          <button class="mobile-dropdown-item danger" type="button" role="menuitem" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i>
            <span>Salir</span>
          </button>
        </div>
      }
    </div>

  </div>
</nav>
