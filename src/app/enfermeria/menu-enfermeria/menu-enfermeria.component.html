<div class="enf-shell" [style.--accent]="accent">
  <aside class="enf-sidebar" [class.is-open]="sidebarAbierta()">
    <header class="enf-brand">
      <p class="enf-kicker">Módulo</p>
      <h1 class="enf-title">{{ title }}</h1>
      <p class="enf-subtitle">{{ subtitle }}</p>
    </header>

    <nav class="enf-nav" aria-label="Secciones de Enfermería">
      @for (opt of options; track opt.ruta) {
        <a
          class="enf-link"
          [routerLink]="opt.ruta"
          routerLinkActive="is-active"
          [style.--card-accent]="menuColor($index)"
          (click)="cerrarSidebar()">
          <span class="enf-link-icon">
            @if (icons[opt.icon]) {
              <span [innerHTML]="icons[opt.icon]"></span>
            } @else {
              <span class="enf-link-dot"></span>
            }
          </span>
          <span class="enf-link-body">
            <span class="enf-link-name">{{ opt.nombre }}</span>
            <span class="enf-link-desc">{{ opt.descripcion }}</span>
          </span>
        </a>
      }
    </nav>

    <a class="enf-back" routerLink="/dash">
      @if (icons['regresar']) {
        <span class="enf-back-icon" [innerHTML]="icons['regresar']"></span>
      }
      Menú principal
    </a>
  </aside>

  <div
    class="enf-overlay"
    [class.is-visible]="sidebarAbierta()"
    (click)="cerrarSidebar()"
    aria-hidden="true"></div>

  <main class="enf-content">
    <header class="enf-topbar">
      <button
        class="enf-toggle"
        type="button"
        (click)="alternarSidebar()"
        [attr.aria-expanded]="sidebarAbierta()"
        aria-label="Abrir menú de Enfermería">
        @if (icons['menu']) {
          <span [innerHTML]="icons['menu']"></span>
        }
      </button>
      <span class="enf-topbar-title">{{ title }}</span>
    </header>

    <router-outlet></router-outlet>
  </main>
</div>
